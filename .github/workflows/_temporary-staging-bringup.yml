name: Temporary DAN Staging Bring-up

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temporary-dan-staging-bringup
  cancel-in-progress: true

jobs:
  staging-bringup:
    if: github.head_ref == 'feature/dan-v1-commercial-visual-polish'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://dan-v1-staging-jongwoon.pages.dev
    env:
      DAN_ENV: staging
      VITE_DAN_ENV: staging
      STAGING_DEPLOY_CONFIRM: deploy-staging-only
      STAGING_CLOUDFLARE_PROJECT: dan-v1-staging-jongwoon
      DAN_STAGING_SUPABASE_PROJECT_REF: wmznpuhqmmqunwtewntt
      STAGING_VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      STAGING_VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check staging-only credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_VITE_SUPABASE_URL" || { echo "NEEDS_USER: STAGING_VITE_SUPABASE_URL"; exit 2; }
          test -n "$STAGING_VITE_SUPABASE_ANON_KEY" || { echo "NEEDS_USER: STAGING_VITE_SUPABASE_ANON_KEY"; exit 2; }
          test -n "$DAN_STAGING_SUPABASE_PROJECT_REF" || { echo "NEEDS_USER: DAN_STAGING_SUPABASE_PROJECT_REF"; exit 2; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "NEEDS_USER: STAGING_CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "NEEDS_USER: STAGING_CLOUDFLARE_ACCOUNT_ID"; exit 2; }

      - name: Assert staging target
        run: npm run assert:staging-deploy

      - name: Build staging
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Ensure isolated Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler pages project list --json | grep -q '"name":"dan-v1-staging-jongwoon"'; then
            npx wrangler pages project create dan-v1-staging-jongwoon --production-branch staging
          fi

      - name: Deploy isolated staging
        run: npx wrangler pages deploy dist --project-name=dan-v1-staging-jongwoon --branch=staging --commit-hash="$GITHUB_SHA" --commit-dirty=true
