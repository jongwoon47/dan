name: Build Signed iOS Staging IPA

on:
  push:
    branches: [feature/dan-v3-real-app-ui]
    paths: [.github/workflows/ios-staging-signed.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-staging-signed
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'jongwoon47/dan' && github.ref == 'refs/heads/feature/dan-v3-real-app-ui'
    runs-on: macos-26
    timeout-minutes: 25
    environment: ios-staging
    env:
      DAN_IOS_ENV: staging
      VITE_DAN_ENV: staging
      VITE_DATA_MODE: supabase
      VITE_BASE: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the verified staging public configuration
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const base = 'https://dan-v1-staging-jongwoon.pages.dev';
          const html = await (await fetch(base)).text();
          const asset = html.match(/src="([^"]+\.js)"/)?.[1];
          if (!asset?.startsWith('/assets/')) throw new Error('Unexpected staging asset');
          const bundle = Buffer.from(await (await fetch(base + asset)).arrayBuffer());
          if (createHash('sha256').update(bundle).digest('hex') !== 'b4c2412e5f169a8198592d93a8936bad176cf266fd0c05a746a40440f0820f83') throw new Error('Staging candidate changed');
          const key = bundle.toString().match(/sb_publishable_[A-Za-z0-9_-]+/)?.[0];
          if (!key || !bundle.toString().includes('wmznpuhqmmqunwtewntt')) throw new Error('Staging configuration missing');
          console.log(`::add-mask::${key}`);
          appendFileSync(process.env.GITHUB_ENV, `VITE_SUPABASE_URL=https://wmznpuhqmmqunwtewntt.supabase.co\nVITE_SUPABASE_ANON_KEY=${key}\n`);
          NODE
      - run: npm run ios:staging
      - name: Import approved signing credentials into an ephemeral keychain
        env:
          P12_BASE64: ${{ secrets.IOS_STAGING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_STAGING_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_STAGING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, base64, pathlib
          for variable, filename in [('P12_BASE64','dan-distribution.p12'),('PROFILE_BASE64','dan-staging.mobileprovision')]:
              pathlib.Path(os.environ['RUNNER_TEMP'], filename).write_bytes(base64.b64decode(os.environ[variable], validate=True))
          PY
          security cms -D -i "$RUNNER_TEMP/dan-staging.mobileprovision" > "$RUNNER_TEMP/dan-profile.plist"
          python3 - <<'PY'
          import os, plistlib, pathlib, hashlib, datetime
          p = plistlib.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'dan-profile.plist').read_bytes())
          assert p['TeamIdentifier'] == ['B4WST38ZNL']
          assert p['Entitlements']['application-identifier'] == 'B4WST38ZNL.app.dan.staging'
          assert not p['Entitlements'].get('get-task-allow', False)
          assert p['Name'] == 'DAN Staging AppStore 20261006'
          assert hashlib.sha256(p['DeveloperCertificates'][0]).hexdigest() == '4ca1d9cad0519d0f467add586f7603a481b3d8a72a955c054aebb1797432e615'
          assert p['ExpirationDate'].replace(tzinfo=datetime.timezone.utc) > datetime.datetime.now(datetime.timezone.utc)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"DAN_PROFILE_UUID={p['UUID']}\nDAN_PROFILE_NAME={p['Name']}\n")
          options = {'method':'app-store-connect','destination':'export','teamID':'B4WST38ZNL','signingStyle':'manual','signingCertificate':'Apple Distribution','provisioningProfiles':{'app.dan.staging':p['Name']},'manageAppVersionAndBuildNumber':False,'uploadSymbols':False}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'dan-export.plist').write_bytes(plistlib.dumps(options))
          for location in ['Library/MobileDevice/Provisioning Profiles','Library/Developer/Xcode/UserData/Provisioning Profiles']:
              d = pathlib.Path.home()/location
              d.mkdir(parents=True, exist_ok=True)
              (d/(p['UUID']+'.mobileprovision')).write_bytes(pathlib.Path(os.environ['RUNNER_TEMP'], 'dan-staging.mobileprovision').read_bytes())
          PY
          KEYCHAIN_PATH="$RUNNER_TEMP/dan-ios.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo 'Importing the staging distribution identity'
          security import "$RUNNER_TEMP/dan-distribution.p12" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 -k "$KEYCHAIN_PATH" > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          curl --fail --silent --show-error --location https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer --output "$RUNNER_TEMP/dan-wwdr.cer"
          echo 'Importing the Apple G3 intermediate certificate'
          security import "$RUNNER_TEMP/dan-wwdr.cer" -k "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          printf 'DAN_SIGNING_KEYCHAIN=%s\n' "$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Archive and export the staging IPA without uploading
        run: |
          set -euo pipefail
          mkdir -p ios-signed
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ios-signed/DAN-Staging.xcarchive \
            -derivedDataPath ios-signed/derived CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=B4WST38ZNL \
            CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$DAN_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $DAN_SIGNING_KEYCHAIN" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive > ios-signed/archive.log 2>&1 || { tail -n 100 ios-signed/archive.log; exit 1; }
          xcodebuild -exportArchive -archivePath ios-signed/DAN-Staging.xcarchive \
            -exportPath ios-signed/export -exportOptionsPlist "$RUNNER_TEMP/dan-export.plist" \
            > ios-signed/export.log 2>&1 || { tail -n 100 ios-signed/export.log; exit 1; }
          cp ios-signed/export/*.ipa ios-signed/DAN-Staging.ipa
      - name: Verify signature, bundle and staging backend
        run: |
          set -euo pipefail
          unzip -q ios-signed/DAN-Staging.ipa -d ios-signed/verified
          APP=$(find ios-signed/verified/Payload -maxdepth 1 -name '*.app' -type d)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" > ios-signed/entitlements.plist 2>/dev/null
          python3 - <<'PY'
          import pathlib, plistlib, json, os, hashlib
          app = next(pathlib.Path('ios-signed/verified/Payload').glob('*.app'))
          info = plistlib.loads((app/'Info.plist').read_bytes())
          ent = plistlib.loads(pathlib.Path('ios-signed/entitlements.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'app.dan.staging'
          assert ent['application-identifier'] == 'B4WST38ZNL.app.dan.staging'
          assert not ent.get('get-task-allow', False)
          bundle = next((app/'public/assets').glob('index-*.js')).read_bytes()
          assert hashlib.sha256(bundle).hexdigest() == 'b4c2412e5f169a8198592d93a8936bad176cf266fd0c05a746a40440f0820f83'
          result = {'sourceSha':os.environ['GITHUB_SHA'],'environment':'staging','bundleId':info['CFBundleIdentifier'],'version':info['CFBundleShortVersionString'],'build':info['CFBundleVersion'],'signature':'PASS','bundleMatchesStaging':True,'uploadedToAppStoreConnect':False,'physicalDeviceQA':'NOT RUN'}
          pathlib.Path('ios-signed/BUILD-INFO.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dan-ios-staging-signed-${{ github.sha }}
          path: |
            ios-signed/DAN-Staging.ipa
            ios-signed/BUILD-INFO.json
            ios-signed/*.log
          retention-days: 14
          if-no-files-found: error
      - name: Remove ephemeral signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/dan-ios.keychain-db" || true
          rm -f "$RUNNER_TEMP/dan-distribution.p12" "$RUNNER_TEMP/dan-staging.mobileprovision" "$RUNNER_TEMP/dan-profile.plist" "$RUNNER_TEMP/dan-export.plist" "$RUNNER_TEMP/dan-wwdr.cer"
          if [ -n "${DAN_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$DAN_PROFILE_UUID.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$DAN_PROFILE_UUID.mobileprovision"
          fi
