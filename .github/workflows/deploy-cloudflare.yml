name: Deploy Cloudflare Pages

# PRODUCTION DEPLOY IS INTENTIONALLY DISABLED.
# The former Supabase project is now DAN staging. Provision a separate
# production Supabase project and update the production guards before enabling.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse until production database exists
        run: |
          echo "REFUSED: production Supabase project is not configured."
          exit 1
