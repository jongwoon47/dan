name: Deploy Cloudflare Pages

# PRODUCTION. Target: https://dan.pages.dev (project name: dan).
# Staging uses Deploy Cloudflare Staging / project dan-v1-staging-jongwoon instead.
# Manual until CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID are set.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assert production frontend config
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${VITE_SUPABASE_URL:-}" || { echo "REFUSED: VITE_SUPABASE_URL is missing"; exit 1; }
          test -n "${VITE_SUPABASE_ANON_KEY:-}" || { echo "REFUSED: VITE_SUPABASE_ANON_KEY is missing"; exit 1; }
      - name: Build
        env:
          VITE_DAN_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dan --commit-dirty=true
