name: Temporary DAN Remote Staging Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temporary-dan-remote-staging-smoke
  cancel-in-progress: true

jobs:
  remote-staging-smoke:
    if: github.head_ref == 'feature/dan-v1-commercial-visual-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check existing remote E2E credentials
        env:
          DAN_E2E_BUYER_EMAIL: ${{ secrets.DAN_E2E_BUYER_EMAIL }}
          DAN_E2E_BUYER_PASSWORD: ${{ secrets.DAN_E2E_BUYER_PASSWORD }}
          DAN_E2E_SELLER_EMAIL: ${{ secrets.DAN_E2E_SELLER_EMAIL }}
          DAN_E2E_SELLER_PASSWORD: ${{ secrets.DAN_E2E_SELLER_PASSWORD }}
        run: |
          test -n "$DAN_E2E_BUYER_EMAIL" || { echo "NEEDS_USER: DAN_E2E_BUYER_EMAIL"; exit 2; }
          test -n "$DAN_E2E_BUYER_PASSWORD" || { echo "NEEDS_USER: DAN_E2E_BUYER_PASSWORD"; exit 2; }
          test -n "$DAN_E2E_SELLER_EMAIL" || { echo "NEEDS_USER: DAN_E2E_SELLER_EMAIL"; exit 2; }
          test -n "$DAN_E2E_SELLER_PASSWORD" || { echo "NEEDS_USER: DAN_E2E_SELLER_PASSWORD"; exit 2; }
      - name: Run remote staging trade smoke
        env:
          VITE_DATA_MODE: supabase
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          DAN_E2E_BUYER_EMAIL: ${{ secrets.DAN_E2E_BUYER_EMAIL }}
          DAN_E2E_BUYER_PASSWORD: ${{ secrets.DAN_E2E_BUYER_PASSWORD }}
          DAN_E2E_SELLER_EMAIL: ${{ secrets.DAN_E2E_SELLER_EMAIL }}
          DAN_E2E_SELLER_PASSWORD: ${{ secrets.DAN_E2E_SELLER_PASSWORD }}
        run: node scripts/e2e-remote-staging.mjs
