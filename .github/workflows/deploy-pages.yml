name: Deploy GitHub Pages

# PRODUCTION DEPLOY IS INTENTIONALLY DISABLED.
# Do not re-enable main push deployment until a separate production
# Supabase project is provisioned and the production guard is updated.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse until production database exists
        run: |
          echo "REFUSED: production Supabase project is not configured."
          exit 1
