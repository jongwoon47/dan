name: Deploy GitHub Pages

# GitHub Pages production deploy stays disabled.
# Public production hosting is Cloudflare Pages (`dan` → dan.pages.dev)
# against the single live DAN Supabase project. See
# docs/SINGLE_SUPABASE_CUTOVER_20261013.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse GitHub Pages production path
        run: |
          echo "REFUSED: use Cloudflare Pages project dan (workflow deploy-cloudflare.yml)."
          exit 1
