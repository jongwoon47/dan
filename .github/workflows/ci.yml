name: CI

on:
  pull_request:
    # Draft PR commits do NOT execute runner jobs. Changing to ready_for_review
    # launches the full gate; subsequent commits to a ready PR re-run it.
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - "feature/dan-**"
      - "cursor/dan-**"
      - "automation/**"
  workflow_dispatch:
    # Explicit milestone checkpoint on the selected ref. No automatic heavy
    # suite on every autonomous draft-PR commit.
    inputs:
      suite:
        description: "checkpoint = ledger only; verify = typecheck/lint/unit/build; full = all"
        required: true
        type: choice
        options:
          - full
          - verify
          - checkpoint
        default: full

permissions:
  contents: read

concurrency:
  group: dan-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    # PAN-style low-cost manual checkpoint: no npm ci, Docker or browsers.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'checkpoint' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-dan-loop-state.mjs

  verify:
    # Preserve required checks on ready PRs and manual verification runs.
    # Skipped jobs in a DRAFT are NOT evidence of a verified current SHA.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite != 'checkpoint') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Check account deletion Edge Function
        run: npx --yes deno@2.9.6 check supabase/functions/delete-account/index.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build


  supabase:
    # Expensive Docker/DB/E2E only at explicit checkpoint or ready-for-review.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - run: npm ci
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - name: Run local two-user trade E2E
        run: |
          eval "$(supabase status -o env)"
          VITE_SUPABASE_URL="$API_URL" \
          VITE_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npm run test:e2e:local
      - run: npx playwright install --with-deps chromium
      - name: Run Supabase browser smoke
        run: |
          eval "$(supabase status -o env)"
          VITE_SUPABASE_URL="$API_URL" \
          VITE_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npx playwright test --config=playwright.supabase.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dan-supabase-browser-smoke
          path: qa-screenshots
          if-no-files-found: warn
      - if: always()
        run: command -v supabase >/dev/null 2>&1 && supabase stop --no-backup || true

  visual:
    # Browser screenshots only at checkpoints and on ready PRs.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual --config=playwright.visual.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dan-v3-visual-qa
          path: qa-screenshots
          if-no-files-found: warn
