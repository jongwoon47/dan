name: CI

# Cost policy: docs/dan-autonomous/CI_COST_POLICY.md
# - Draft PR sync: no runner jobs (autonomous iteration stays draft).
# - Ready PR synchronize: verify only (typecheck/lint/unit/build).
# - Full supabase/E2E/visual: ready_for_review, base main, title [ci-full],
#   label ci-checkpoint (pull_request labeled), or workflow_dispatch suite=full.
# - cancel-in-progress false: do not discard an in-flight heavy suite on the next push.
# Job names verify / supabase / visual preserved for branch protection.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    branches:
      - main
      - "feature/dan-**"
      - "cursor/dan-**"
      - "automation/**"
  workflow_dispatch:
    inputs:
      suite:
        description: "checkpoint = ledger only; verify = typecheck/lint/unit/build; full = all"
        required: true
        type: choice
        options:
          - full
          - verify
          - checkpoint
        default: full

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dan-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  checkpoint:
    # PAN-style low-cost manual checkpoint: no npm ci, Docker or browsers.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'checkpoint' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-dan-loop-state.mjs
      - run: node scripts/validate-dan-ci-policy.mjs

  verify:
    # Ready PRs + manual verify/full. Skipped draft jobs are not PASS evidence.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite != 'checkpoint') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:ci-policy
      - run: npm run typecheck
      - name: Check account deletion Edge Function
        run: npx --yes deno@2.9.6 check supabase/functions/delete-account/index.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  supabase:
    # Heavy DB/E2E only at explicit full checkpoints (not every ready-PR push).
    if: "${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.base_ref == 'main' || github.event.action == 'ready_for_review' || contains(github.event.pull_request.title, '[ci-full]') || contains(join(github.event.pull_request.labels.*.name, ','), 'ci-checkpoint'))) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - run: npm ci
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - name: Run local two-user trade E2E
        run: |
          eval "$(supabase status -o env)"
          VITE_SUPABASE_URL="$API_URL" \
          VITE_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npm run test:e2e:local
      - run: npx playwright install --with-deps chromium
      - name: Run Supabase browser smoke
        run: |
          eval "$(supabase status -o env)"
          VITE_SUPABASE_URL="$API_URL" \
          VITE_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npx playwright test --config=playwright.supabase.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dan-supabase-browser-smoke
          path: qa-screenshots
          if-no-files-found: warn
      - if: always()
        run: command -v supabase >/dev/null 2>&1 && supabase stop --no-backup || true

  visual:
    # Visual only with full checkpoints; ready-PR synchronize alone stays verify-only.
    if: "${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.base_ref == 'main' || github.event.action == 'ready_for_review' || contains(github.event.pull_request.title, '[ci-full]') || contains(join(github.event.pull_request.labels.*.name, ','), 'ci-checkpoint'))) }}"
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual --config=playwright.visual.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dan-v3-visual-qa
          path: qa-screenshots
          if-no-files-found: warn
