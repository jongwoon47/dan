name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build


  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - name: Run local two-user trade E2E
        run: |
          eval "$(supabase status -o env)"
          VITE_SUPABASE_URL="$API_URL" \
          VITE_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npm run test:e2e:local
      - if: always()
        run: supabase stop --no-backup

  visual:
    needs: [verify, supabase]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/visual --config=playwright.visual.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dan-v1-mobile-screens
          path: qa-screenshots/dan-v1
          if-no-files-found: warn
