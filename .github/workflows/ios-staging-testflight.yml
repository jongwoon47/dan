name: Upload DAN Staging to TestFlight

on:
  workflow_dispatch:
    inputs:
      signed_run_id:
        description: Run ID from Build Signed iOS Staging IPA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dan-staging-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'jongwoon47/dan' && github.ref == 'refs/heads/feature/dan-v3-real-app-ui'
    runs-on: macos-26
    timeout-minutes: 25
    environment: ios-staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signed_run_id }}
          name: dan-ios-staging-signed
          path: signed
      - name: Verify the staging IPA before upload
        run: |
          set -euo pipefail
          test -f signed/DAN-Staging.ipa
          shasum -a 256 signed/DAN-Staging.ipa | tee signed/upload.sha256
          unzip -q signed/DAN-Staging.ipa -d verified
          APP=$(find verified/Payload -maxdepth 1 -name '*.app' -type d)
          codesign --verify --deep --strict "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = app.dan.staging
          JS=$(find "$APP/public/assets" -maxdepth 1 -name 'index-*.js' | head -n 1)
          test -n "$JS"
          grep -F 'wmznpuhqmmqunwtewntt' "$JS"
      - name: Upload staging build to Apple without public submission
        env:
          ASC_PRIVATE_KEY: ${{ secrets.IOS_STAGING_ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_2JCVD577KL.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_2JCVD577KL.p8"
          xcrun altool --upload-app --type ios --file signed/DAN-Staging.ipa --apiKey 2JCVD577KL --apiIssuer 49e97453-6a8d-45ae-8a99-ac87915f4936
      - name: Remove upload credentials
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_2JCVD577KL.p8"
